{% extends "base.html" %}

{% block content %}
<form action="/graph" method="GET">
    <label for="ticker">Select a ticker:</label>
    <select name="ticker" id="ticker">
      {% for ticker in tickers %}
        <option value="{{ ticker }}">{{ ticker }}</option>
      {% endfor %}
    </select>
    <button type="submit">View Chart</button>
  </form>
{% endblock %}
